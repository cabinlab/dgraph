name: Build and push to GHCR

on:
  push:
    branches:
      - feat/s2-geo-new-types
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cabinlab/dgraph:latest
            ghcr.io/cabinlab/dgraph:${{ github.sha }}
