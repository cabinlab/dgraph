type Hotel {
    id: ID!
    name: String!
    location: Point @search
    secretLocation: Point
    area: Polygon @search
    secretArea: Polygon
    branches: MultiPolygon @search
    secretBranches: MultiPolygon
    route: LineString @search
    secretRoute: LineString
    routes: MultiLineString @search
    secretRoutes: MultiLineString
    landmarks: MultiPoint @search
    secretLandmarks: MultiPoint
}
